spring.application.name=event-booking-api

spring.datasource.url=jdbc:h2:mem:booking;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

logging.level.be.guho.eventbooking=DEBUG

spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:data/schema.sql
spring.sql.init.data-locations=classpath:data/data.sql
spring.h2.console.enabled=true
